<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Today's Coffee</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <main class="landing-page">
        <section class="intro-shell">
            <div class="intro-card">
                <h1>Today's Coffee</h1>
                <div class="coffee">☕</div>
                <p>
                    오늘 배운 <strong>HTML</strong>과
                    <strong>CSS</strong>를 이용하여<br>
                    카드를 꾸며보았습니다.
                </p>

                <hr>

                <p>
                    다음 화면에서는<br>
                    카페 홈페이지를 만나볼 수 있습니다.
                </p>

                <a href="home.html" class="button">
                    카페 홈페이지 보기 →
                </a>

                <div class="progress-wrap">
                    <div class="progress-label">홈페이지 이동 중...</div>
                    <div class="progress-bar">
                        <div class="progress-fill"></div>
                    </div>
                </div>

                <div class="notice">
                    ☕ 2초 후 자동으로 이동합니다.
                </div>
            </div>
        </section>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const card = document.querySelector('.intro-card');
            const fill = document.querySelector('.progress-fill');
            const notice = document.querySelector('.notice');
            const totalTime = 3000;
            const fadeStart = 2000;
            const start = performance.now();

            function animate(now) {
                const elapsed = now - start;
                const progress = Math.min(100, (elapsed / fadeStart) * 100);
                fill.style.width = progress + '%';

                if (elapsed >= fadeStart) {
                    card.classList.add('fade-out');
                    notice.textContent = '화면이 전환되고 있습니다...';
                }

                if (elapsed >= totalTime) {
                    window.location.href = 'home.html';
                    return;
                }

                requestAnimationFrame(animate);
            }

            requestAnimationFrame(animate);
        });
    </script>
</body>

</html>

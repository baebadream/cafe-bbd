<!DOCTYPE html>
<html lang="ko">
 <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>고객 센터 - The Cafe BBD</title>
  <link rel="stylesheet" href="styles.css">
 </head>
 <body>
  <div class="page-shell">
    <div class="single-page-card">
    <header class="site-header">
      <a class="brand" href="home.html">The Cafe BBD</a>
      <button class="mobile-nav-toggle" aria-label="메뉴 열기" aria-expanded="false">☕</button>
      <nav class="nav-links">
        <a href="home.html">home</a>
        <a href="story.html">The Cafe BBD</a>
        <a href="menu.html">메뉴 소개</a>
        <a href="news.html">매장 소식</a>
        <a href="map.html">카페 오는 길</a>
        <a class="active" href="center.html">고객 센터</a>
      </nav>
    </header>

    <section class="content-card">
      <h2 class="page-title">📝 고객 센터</h2>
      <p class="subtitle">소중한 의견을 남겨주세요. 더 나은 서비스로 보답하겠습니다.</p>
      <div class="form-card hover-card">
        <form action="#" method="post">
          <div class="form-group">
            <label for="userName">이름</label>
            <input type="text" id="userName" name="userName" placeholder="홍길동" required>
          </div>
          <div class="form-group">
            <label for="userNick">닉네임</label>
            <input type="text" id="userNick" name="userNick" placeholder="커피요정">
          </div>
          <div class="form-group">
            <label for="userAddr">주소</label>
            <input type="text" id="userAddr" name="userAddr" placeholder="서울시 강남구...">
          </div>
          <div class="form-group">
            <label for="userPhone">전화번호</label>
            <input type="tel" id="userPhone" name="userPhone" placeholder="010-0000-0000">
          </div>
          <div class="form-group">
            <label for="userEmail">이메일</label>
            <input type="email" id="userEmail" name="userEmail" placeholder="example@bbd.com">
          </div>
          <div class="btn-row">
            <button type="submit">등록하기</button>
            <button type="reset">다시쓰기</button>
          </div>
        </form>
      </div>
    </section>

    <footer>
      <span class="contact-line"><strong>회사이름</strong>주식회사 The Cafe BBD</span>
      <span class="contact-line"><strong>주소</strong>서울 강남구 강남대로</span>
      <span class="contact-line"><strong>연락처</strong>02)2222-3333</span>
      <span class="contact-line"><strong>이메일</strong>thecafe@bbd.com</span>
    </footer>
    </div>
  </div>
  <script src="script.js"></script>
 </body>
</html>
